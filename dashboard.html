<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ámbar Blanco · Dashboard de Ventas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --negro: #1A1714; --blanco: #FFFFFF; --crema: #FAF8F5; --marfil: #F2EEE8;
    --maroon: #7F2A2A; --maroon-dark: #5E1E1E; --ambar: #C9973E;
    --gris: #6B6660; --gris-claro: #D8D3CB; --linea: #E4DFD6;
    --sombra: 0 2px 24px rgba(26,23,20,0.08);
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Georgia','Times New Roman',serif; background:var(--marfil); color:var(--negro); -webkit-font-smoothing:antialiased; }
  .app{ max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }
  .app-header{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; margin-bottom: 24px; padding-bottom:20px; border-bottom: 1px solid var(--linea); flex-wrap:wrap;
  }
  .app-header-left{ display:flex; align-items:center; gap:16px; }
  .app-header img{ height:42px; width:auto; }
  .app-header h1{ font-size: 15px; letter-spacing: 3px; text-transform: uppercase; font-weight: 400; margin:0; }
  .app-header span{
    display:block; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11px;
    letter-spacing: 1px; color: var(--gris); text-transform: uppercase; margin-top:2px;
  }
  .nav-links{ display:flex; gap:8px; flex-wrap:wrap; }
  .nav-link{
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:11.5px; letter-spacing:1px;
    text-transform:uppercase; color: var(--maroon); text-decoration:none; border:1px solid var(--maroon);
    padding: 9px 16px; border-radius: 3px; white-space:nowrap;
  }
  .nav-link:hover{ background: var(--maroon); color: var(--blanco); }

  .resumen-bar{ display:flex; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
  .resumen-card{
    background: var(--blanco); border:1px solid var(--linea); border-radius:4px;
    padding: 16px 20px; flex:1; min-width:150px; box-shadow: var(--sombra);
  }
  .resumen-card .num{ font-size: 24px; font-weight:700; color: var(--maroon); }
  .resumen-card .num.pos::after{ content:' ▲'; font-size:13px; color:#2C6B2C; }
  .resumen-card .num.neg::after{ content:' ▼'; font-size:13px; color:#A32B2B; }
  .resumen-card .lbl{
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:10px; letter-spacing:1px;
    text-transform:uppercase; color: var(--gris); margin-top:4px;
  }

  .panel{ background: var(--blanco); border:1px solid var(--linea); border-radius:4px; padding:26px; box-shadow: var(--sombra); margin-bottom:22px; }
  .panel h2{
    font-size:12px; letter-spacing:2.5px; text-transform:uppercase; color:var(--maroon); font-weight:600;
    margin: 0 0 18px 0; font-family:'Helvetica Neue', Arial, sans-serif; display:flex; align-items:center; gap:10px;
  }
  .panel h2::after{ content:''; flex:1; height:1px; background:var(--linea); }
  .chart-wrap{ position:relative; height: 320px; }

  .toggle-row{ display:flex; gap:8px; margin-bottom:18px; }
  .toggle-btn{
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:11.5px; letter-spacing:0.5px;
    padding: 8px 14px; border-radius:20px; border:1px solid var(--gris-claro); background:var(--crema);
    color:var(--negro); cursor:pointer;
  }
  .toggle-btn.activo{ background:var(--negro); border-color:var(--negro); color:var(--blanco); }

  table.tabla-ranking{ width:100%; border-collapse:collapse; font-family:'Helvetica Neue', Arial, sans-serif; font-size:13px; }
  table.tabla-ranking th{
    text-align:left; font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--gris);
    padding:8px 6px; border-bottom:1.5px solid var(--negro);
  }
  table.tabla-ranking th.num, table.tabla-ranking td.num{ text-align:right; }
  table.tabla-ranking td{ padding:9px 6px; border-bottom:1px solid var(--linea); }

  .estado{ font-family:'Helvetica Neue', Arial, sans-serif; font-size:13px; color:var(--gris); padding: 30px 0; text-align:center; }
</style>
</head>

<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbxc8uIwQiBsGt348bI0czEmT8KjRJfLq8trpgYURkN_dva1Q0CbQRmWVns2AcAgWbAD5Q/exec';

let VENTAS = [];
let DETALLE = [];
let chartInstance = null;
let modoAcumulado = false;

function money(n){
  n = Number(n) || 0;
  return '$' + Math.round(n).toLocaleString('es-MX');
}

function claveMes(fechaStr){
  const d = new Date(fechaStr);
  if(isNaN(d.getTime())) return null;
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}

function nombreMes(clave){
  const [y,m] = clave.split('-');
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return meses[parseInt(m)-1] + ' ' + y.slice(2);
}

async function cargar(){
  try{
    const [respVentas, respDetalle] = await Promise.all([
      fetch(SHEETS_URL + '?tipo=clientes', { method: 'GET' }),
      fetch(SHEETS_URL + '?tipo=detalle', { method: 'GET' })
    ]);
    const filas = await respVentas.json();
    VENTAS = filas.filter(f => f.fechaCompra && f.total);
    try{ DETALLE = await respDetalle.json(); }catch(e){ DETALLE = []; }
    render();
  }catch(err){
    document.getElementById('contenido').innerHTML = '<div class="estado">No se pudo cargar la información. Revisa tu conexión o la URL de Google Sheets en el código.</div>';
    console.error(err);
  }
}

function agruparPorMes(){
  const grupos = {};
  VENTAS.forEach(f => {
    const clave = claveMes(f.fechaCompra);
    if(!clave) return;
    if(!grupos[clave]) grupos[clave] = { total: 0, compras: 0 };
    grupos[clave].total += Number(f.total) || 0;
    grupos[clave].compras += 1;
  });
  const claves = Object.keys(grupos).sort();
  return { claves, grupos };
}

function agruparPorCampo(campo, top){
  const grupos = {};
  DETALLE.forEach(d => {
    const valor = (d[campo] || '').toString().trim();
    if(!valor) return;
    if(!grupos[valor]) grupos[valor] = { veces: 0, unidades: 0, importe: 0 };
    grupos[valor].veces += 1;
    grupos[valor].unidades += Number(d.cantidad) || 0;
    grupos[valor].importe += Number(d.importe) || 0;
  });
  return Object.entries(grupos).sort((a,b) => b[1].unidades - a[1].unidades).slice(0, top || 8);
}

function agruparPorCuenta(){
  const grupos = {};
  VENTAS.forEach(f => {
    const cuenta = f.cuentaDestino || 'Sin especificar';
    if(!grupos[cuenta]) grupos[cuenta] = { total: 0, compras: 0 };
    grupos[cuenta].total += Number(f.total) || 0;
    grupos[cuenta].compras += 1;
  });
  return Object.entries(grupos).sort((a,b) => b[1].total - a[1].total);
}

function render(){
  if(VENTAS.length === 0){
    document.getElementById('contenido').innerHTML = '<div class="estado">Aún no hay ventas registradas. En cuanto captures una en "Registrar venta", aparecerá aquí.</div>';
    return;
  }

  const { claves, grupos } = agruparPorMes();
  const totalGeneral = VENTAS.reduce((s,f) => s + (Number(f.total)||0), 0);
  const totalCompras = VENTAS.length;

  const mesActualClave = claves[claves.length - 1];
  const mesAnteriorClave = claves[claves.length - 2];
  const totalMesActual = mesActualClave ? grupos[mesActualClave].total : 0;
  const totalMesAnterior = mesAnteriorClave ? grupos[mesAnteriorClave].total : null;
  let crecimientoTxt = '—';
  let crecimientoClass = '';
  if(totalMesAnterior != null && totalMesAnterior > 0){
    const pct = ((totalMesActual - totalMesAnterior) / totalMesAnterior) * 100;
    crecimientoTxt = (pct >= 0 ? '+' : '') + pct.toFixed(1) + '%';
    crecimientoClass = pct >= 0 ? 'pos' : 'neg';
  }

  document.getElementById('contenido').innerHTML = `
    <div class="resumen-bar">
      <div class="resumen-card"><div class="num">${money(totalGeneral)}</div><div class="lbl">Ventas totales</div></div>
      <div class="resumen-card"><div class="num">${totalCompras}</div><div class="lbl">Compras registradas</div></div>
      <div class="resumen-card"><div class="num">${mesActualClave ? money(totalMesActual) : '—'}</div><div class="lbl">Este mes (${mesActualClave ? nombreMes(mesActualClave) : '—'})</div></div>
      <div class="resumen-card"><div class="num ${crecimientoClass}">${crecimientoTxt}</div><div class="lbl">Vs. mes anterior</div></div>
    </div>

    <div class="panel">
      <h2>Ventas por mes</h2>
      <div class="toggle-row">
        <button class="toggle-btn activo" id="btnMensual" onclick="cambiarModo(false)">Por mes</button>
        <button class="toggle-btn" id="btnAcumulado" onclick="cambiarModo(true)">Acumulado</button>
      </div>
      <div class="chart-wrap"><canvas id="graficaVentas"></canvas></div>
    </div>

    <div class="panel">
      <h2>Tipo de producto más vendido</h2>
      <table class="tabla-ranking">
        <thead><tr><th>Producto</th><th class="num">Unidades</th><th class="num">Ingresos</th></tr></thead>
        <tbody id="tablaTipoProducto"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Aromas más vendidos</h2>
      <table class="tabla-ranking">
        <thead><tr><th>Aroma</th><th class="num">Unidades</th><th class="num">Ingresos</th></tr></thead>
        <tbody id="tablaAromas"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Presentaciones más vendidas</h2>
      <table class="tabla-ranking">
        <thead><tr><th>Presentación</th><th class="num">Unidades</th><th class="num">Ingresos</th></tr></thead>
        <tbody id="tablaPresentaciones"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>¿Dónde está el dinero?</h2>
      <table class="tabla-ranking">
        <thead><tr><th>Cuenta / método</th><th class="num">Compras</th><th class="num">Total</th></tr></thead>
        <tbody id="tablaCuentas"></tbody>
      </table>
    </div>
  `;

  dibujarGrafica(claves, grupos);
  renderRankings();
  renderCuentas();
}

function cambiarModo(acumulado){
  modoAcumulado = acumulado;
  document.getElementById('btnMensual').classList.toggle('activo', !acumulado);
  document.getElementById('btnAcumulado').classList.toggle('activo', acumulado);
  const { claves, grupos } = agruparPorMes();
  dibujarGrafica(claves, grupos);
}

function dibujarGrafica(claves, grupos){
  const labels = claves.map(nombreMes);
  let data = claves.map(c => grupos[c].total);
  if(modoAcumulado){
    let acc = 0;
    data = data.map(v => acc += v);
  }

  if(chartInstance) chartInstance.destroy();
  const ctx = document.getElementById('graficaVentas').getContext('2d');
  chartInstance = new Chart(ctx, {
    type: modoAcumulado ? 'line' : 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: modoAcumulado ? 'Ventas acumuladas' : 'Ventas del mes',
        data: data,
        backgroundColor: '#7F2A2A',
        borderColor: '#7F2A2A',
        tension: 0.3,
        fill: modoAcumulado,
        backgroundColor: modoAcumulado ? 'rgba(127,42,42,0.08)' : '#7F2A2A',
        pointBackgroundColor: '#C9973E',
        pointRadius: modoAcumulado ? 4 : 0,
        borderRadius: 4,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: { label: (ctx) => '$' + ctx.parsed.y.toLocaleString('es-MX') }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { callback: (v) => '$' + v.toLocaleString('es-MX'), font: { family: 'Helvetica Neue' } },
          grid: { color: '#E4DFD6' }
        },
        x: {
          ticks: { font: { family: 'Helvetica Neue' } },
          grid: { display: false }
        }
      }
    }
  });
}

function pintarTablaRanking(idTabla, lista){
  document.getElementById(idTabla).innerHTML = lista.map(([nombre, info]) => `
    <tr><td>${nombre}</td><td class="num">${info.unidades}</td><td class="num">${money(info.importe)}</td></tr>
  `).join('') || '<tr><td colspan="3">Sin datos suficientes todavía</td></tr>';
}

function renderRankings(){
  pintarTablaRanking('tablaTipoProducto', agruparPorCampo('producto', 8));
  pintarTablaRanking('tablaAromas', agruparPorCampo('aroma', 8));
  pintarTablaRanking('tablaPresentaciones', agruparPorCampo('presentacion', 8));
}

function renderCuentas(){
  const cuentas = agruparPorCuenta();
  document.getElementById('tablaCuentas').innerHTML = cuentas.map(([nombre, info]) => `
    <tr><td>${nombre}</td><td class="num">${info.compras}</td><td class="num">${money(info.total)}</td></tr>
  `).join('') || '<tr><td colspan="3">Sin datos suficientes todavía</td></tr>';
}

cargar();
</script>
